[project]
name = "podcast-rss-generator"
version = "1.0.0"
description = "Generate a podcast RSS feed from a YAML configuration file, with validation and asset verification."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Viktor Petersson" }]
requires-python = ">=3.11"

# Three runtime dependencies, all actively maintained and widely used.
#
# Dropped in this refactor:
#   retry  last released in 2016, and pulled in `decorator` plus `py` —
#          pytest's retired legacy library. Three packages for one decorator,
#          replaced by the same explicit loop the module already used for
#          ffprobe.
#   sh     used only to invoke ffprobe, which subprocess does from the
#          standard library. It also resolved the binary at import time, so
#          the module would not load without ffmpeg installed.
dependencies = [
    "Markdown>=3.5.1",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/vpetersson/podcast-rss-generator"
Issues = "https://github.com/vpetersson/podcast-rss-generator/issues"

[project.scripts]
podcast-rss-generator = "rss_generator:main"

[dependency-groups]
# Tooling, not shipped in the Docker image. `uv sync --no-dev` skips these.
dev = [
    "mypy>=1.13",
    "ruff>=0.16.3",
    "types-Markdown>=3.5",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "yamllint>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["rss_generator.py"]
sources = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ruff's default set (E4/E7/E9, F) plus rules that catch the classes of
# problem this audit found: likely bugs (B), unsorted imports (I), and
# comprehension/modernization slips (C4, UP).
#
# E501 is deliberately absent: `ruff format` owns line layout, and it cannot
# split long string literals, so enabling E501 only produces noise the
# formatter will not resolve.
select = ["E4", "E7", "E9", "F", "B", "I", "C4", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["rss_generator.py", "tests"]

# Strict enough to have caught the bugs this refactor fixes, without
# demanding annotations on the existing test suite in one go.
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# rss_generator.py itself is checked strictly. The test suite is checked too,
# but with two allowances:
#
#   union-attr    31 of the 33 findings are `channel.find(...)` returning
#                 Optional[Element] inside an assertion. A None there fails the
#                 test on the next line regardless, so requiring a guard at every
#                 call site adds noise without catching anything.
#   untyped-defs  the 24 test methods are not annotated yet.
#
# Both are worth revisiting; neither is worth blocking this refactor on.
module = ["test_rss_generator"]
disallow_untyped_defs = false
disable_error_code = ["union-attr", "arg-type", "var-annotated", "assignment", "no-untyped-call"]
