[project]
name = "podcast-rss-generator"
# CalVer, YYYY.M.PATCH — see "Versioning" in README.md. The value lives in
# rss_generator.__version__ so `--version` and the package metadata cannot
# drift apart; [tool.hatch.version] below reads it from there.
dynamic = ["version"]
description = "Generate a podcast RSS feed from a YAML configuration file, with validation and asset verification."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Viktor Petersson" }]
requires-python = ">=3.11"

# Three runtime dependencies, all actively maintained and widely used.
#
# Dropped in this refactor:
#   retry  last released in 2016, and pulled in `decorator` plus `py` —
#          pytest's retired legacy library. Three packages for one decorator,
#          replaced by the same explicit loop the module already used for
#          ffprobe.
#   sh     used only to invoke ffprobe, which subprocess does from the
#          standard library. It also resolved the binary at import time, so
#          the module would not load without ffmpeg installed.
dependencies = [
    "Markdown>=3.5.1",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/vpetersson/podcast-rss-generator"
Issues = "https://github.com/vpetersson/podcast-rss-generator/issues"

[project.scripts]
podcast-rss-generator = "rss_generator:main"

[dependency-groups]
# Tooling, not shipped in the Docker image. `uv sync --no-dev` skips these.
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.7",
    "types-Markdown>=3.5",
    "types-PyYAML>=6.0",
    "types-requests>=2.33.0.20260906",
    "yamllint>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "rss_generator.py"

[tool.hatch.build.targets.wheel]
only-include = ["rss_generator.py"]
sources = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ruff's default set (E4/E7/E9, F) plus rules that catch the classes of
# problem this audit found: likely bugs (B), unsorted imports (I), and
# comprehension/modernization slips (C4, UP).
#
# E501 is deliberately absent: `ruff format` owns line layout, and it cannot
# split long string literals, so enabling E501 only produces noise the
# formatter will not resolve.
# Added with the pytest migration: PT keeps the suite idiomatic (bare
# asserts, well-formed parametrize/fixture usage), SIM and RUF catch the
# usual redundant constructs.
select = ["E4", "E7", "E9", "F", "B", "I", "C4", "UP", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The regression tests document behaviour of private helpers (_CDATA_OPEN and
# friends), which is the point of them.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.11"
files = ["rss_generator.py", "tests"]

# The test suite is held to the same bar as the module: every test is
# annotated, and `element()` in tests/helpers.py narrows the Optional that
# Element.find returns, so no per-module relaxations are needed.
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
# `.` on the path so `import rss_generator` works without the project being
# installed (e.g. `uv run --no-project pytest`); `tests` so the helpers module
# is importable from the test modules.
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    # -ra prints a reason for every non-passing test; the two --strict flags
    # turn an unknown marker or a typo in this table into an error rather than
    # a warning that nobody reads.
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rss_generator"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
# A floor, not a target: it fails a change that drops coverage sharply
# without demanding a test for every error branch.
fail_under = 85
show_missing = true
