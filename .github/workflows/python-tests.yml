---
name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv caches the resolved environment keyed on uv.lock, replacing the
          # manual actions/cache step this workflow used for pip.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        # Reads .python-version, so local, CI and the Docker image agree.
        run: uv python install

      - name: Install dependencies
        # --frozen fails if uv.lock is out of step with pyproject.toml, rather
        # than quietly resolving something different from what was committed.
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy

      - name: Ensure example file passes YAMLlint
        run: >
          uv run yamllint -fgithub -d "{rules: {line-length: false}}"
          podcast_config.example.yaml

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is requires-python; the ceiling is the newest release the
        # dependencies support. Anything in between is what users actually run.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        # The suite stubs every HTTP call and every ffprobe invocation, so it
        # needs neither the network nor ffmpeg installed.
        run: uv run pytest --cov --cov-report=term-missing

  feed:
    name: Generate the example feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install the package
        # No --no-install-project here: the point of this job is to exercise
        # the installed distribution.
        run: uv sync --frozen --no-dev

      - name: Generate Feed from Example
        # The installed console script, not a path into the source tree — the
        # same entry point the Docker image runs.
        run: >
          uv run podcast-rss-generator
          --input-file podcast_config.example.yaml
          --output-file podcast_feed.xml
          --skip-asset-verification

      - name: Install xq
        run: |
          wget -q https://github.com/sibprogrammer/xq/releases/download/v1.2.3/xq_1.2.3_linux_amd64.tar.gz
          tar xfz xq_1.2.3_linux_amd64.tar.gz
          sudo mv xq /usr/local/bin/

      - name: Validate Feed XML with xq
        run: xq . podcast_feed.xml

      - name: Upload Test Feed Artifact
        uses: actions/upload-artifact@v7
        with:
          name: podcast-feed-xml
          path: podcast_feed.xml

  package:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Build the wheel and sdist
        run: uv build

      - name: Install the wheel into a clean environment and run it
        # Installing from dist/ rather than the source tree is what catches a
        # module left out of the wheel.
        run: |
          uv venv /tmp/wheel-check
          VIRTUAL_ENV=/tmp/wheel-check uv pip install dist/*.whl
          /tmp/wheel-check/bin/podcast-rss-generator --version
          /tmp/wheel-check/bin/podcast-rss-generator \
            --input-file podcast_config.example.yaml --dry-run

      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    name: Build and run the action image
    # The action ships as a Docker action, so a broken Dockerfile breaks every
    # consumer. Nothing verified it built before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the action image
        run: docker build -t podcast-rss-generator:ci .

      - name: Report the version the image reports
        run: docker run --rm podcast-rss-generator:ci --version

      - name: Generate a feed through the image
        # No -w: the image sets WORKDIR to the /data mount point itself.
        run: >
          docker run --rm -v "$PWD:/data" podcast-rss-generator:ci
          --input-file podcast_config.example.yaml
          --output-file /data/docker_feed.xml
          --skip-asset-verification

      - name: Confirm the image produced parseable XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('docker_feed.xml')"
