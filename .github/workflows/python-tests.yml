---
name: Python Unit Tests and Linting

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv caches the resolved environment keyed on uv.lock, replacing the
          # manual actions/cache step this workflow used for pip.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        # Reads .python-version, so local, CI and the Docker image agree.
        run: uv python install

      - name: Install dependencies
        # --frozen fails if uv.lock is out of step with pyproject.toml, rather
        # than quietly resolving something different from what was committed.
        run: uv sync --frozen

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy

      - name: Ensure example file passes YAMLlint
        run: >
          uv run yamllint -fgithub -d "{rules: {line-length: false}}"
          podcast_config.example.yaml

      - name: Generate Feed from Example
        run: >
          uv run python rss_generator.py
          --input-file podcast_config.example.yaml
          --output-file podcast_feed.xml
          --skip-asset-verification

      - name: Install xq
        run: |
          wget -q https://github.com/sibprogrammer/xq/releases/download/v1.2.3/xq_1.2.3_linux_amd64.tar.gz
          tar xfz xq_1.2.3_linux_amd64.tar.gz
          sudo mv xq /usr/local/bin/

      - name: Validate Feed XML with xq
        run: xq . podcast_feed.xml

      - name: Run tests
        run: uv run python -m unittest discover tests

      - name: Upload Test Feed Artifact
        uses: actions/upload-artifact@v7
        with:
          name: podcast-feed-xml
          path: podcast_feed.xml

  docker:
    # The action ships as a Docker action, so a broken Dockerfile breaks every
    # consumer. Nothing verified it built before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the action image
        run: docker build -t podcast-rss-generator:ci .

      - name: Generate a feed through the image
        run: >
          docker run --rm -v "$PWD:/data" -w /data podcast-rss-generator:ci
          --input-file podcast_config.example.yaml
          --output-file /data/docker_feed.xml
          --skip-asset-verification

      - name: Confirm the image produced parseable XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('docker_feed.xml')"
