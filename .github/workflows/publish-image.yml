---
name: Publish image

# The action runs a prebuilt image from GHCR rather than building the
# Dockerfile on every consumer's runner. action.yaml picks the image tag from
# the ref the caller pinned, so this publishes one image per ref a caller can
# pin: master, each v* release tag, and each commit on master by its SHA.
#
# workflow_dispatch republishes a ref by hand, e.g. if a run failed.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# master's image is a moving tag: if two pushes overlap, the newer one must
# win. A cancelled run leaves its commit without a sha- image, which the
# action handles by building that commit's Dockerfile.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        # A tag that disagrees with the declared version would publish an
        # image under one name that reports another from --version.
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The first three are what action.yaml derives from the caller's
          # ref: the branch or tag name verbatim, and sha-<full sha> for a
          # pinned commit. The bare version and latest are for people running
          # the image by hand, and only move on a release tag.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 covers self-hosted and GitHub's arm runners; nothing in the
          # image is architecture-specific beyond the base and ffmpeg.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: docker run --rm "${IMAGE}:sha-${GITHUB_SHA}" --version
