---
name: Publish image

# The action runs a prebuilt image from GHCR rather than building the
# Dockerfile on every consumer's runner. This workflow is what puts that image
# there: one build per release, tagged with the version action.yaml pins.
#
# workflow_dispatch exists to (re)publish the version a ref declares without
# cutting a new tag, e.g. to backfill an image for a release that predates
# this workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        # A tag that disagrees with the declared version would publish an
        # image under one name that reports another from --version.
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check action.yaml pins this version
        # Otherwise the release would publish an image the action at this ref
        # never pulls. tests/test_packaging.py enforces the same thing on PRs.
        run: |
          grep -qF "docker://${IMAGE}:${{ steps.version.outputs.version }}'" action.yaml || {
            echo "::error::action.yaml does not reference ${IMAGE}:${{ steps.version.outputs.version }}"
            exit 1
          }

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The bare version is what action.yaml pins. latest is for people
          # running the image by hand and only moves on a tagged release.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 covers self-hosted and GitHub's arm runners; nothing in the
          # image is architecture-specific beyond the base and ffmpeg.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          docker run --rm "${IMAGE}:${{ steps.version.outputs.version }}" --version
